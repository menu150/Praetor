<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <title>Praetor Dashboard</title>
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body>
  <div class="container my-4">

    <!-- Optional Navbar -->
    <nav class="navbar navbar-light bg-light mb-4 rounded">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Praetor</span>
      </div>
    </nav>

    <!-- Run Command Card -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title">Run Command</h5>
        <div class="input-group mb-3">
          <input
            id="cmd"
            type="text"
            class="form-control"
            placeholder="Type a command…"
          />
          <button
            class="btn btn-primary"
            onclick="runCommand()"
          >Go</button>
        </div>
        <textarea
          id="output"
          class="form-control"
          rows="5"
          readonly
          placeholder="Output…"
        ></textarea>
      </div>
    </div>

    <!-- Teach New Skill Card -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title">Teach New Skill</h5>
        <div class="row g-2 mb-3">
          <div class="col-md-5">
            <input
              id="teach_trigger"
              type="text"
              class="form-control"
              placeholder="Trigger phrase…"
            />
          </div>
          <div class="col-md-5">
            <input
              id="teach_command"
              type="text"
              class="form-control"
              placeholder="Shell command…"
            />
          </div>
          <div class="col-md-2">
            <button
              class="btn btn-success w-100"
              onclick="teachSkill()"
            >Teach</button>
          </div>
        </div>
        <textarea
          id="teach_output"
          class="form-control"
          rows="3"
          readonly
          placeholder="Result…"
        ></textarea>
      </div>
    </div>

    <!-- List Skills Card -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title">All Skills</h5>
        <button
          class="btn btn-outline-secondary mb-2"
          onclick="loadSkills()"
        >Refresh Skills</button>
        <textarea
          id="skills_list"
          class="form-control"
          rows="6"
          readonly
          placeholder="Skills will appear here…"
        ></textarea>
      </div>
    </div>

  </div>

  <!-- Your existing JS functions -->
  <script>
    async function runCommand() {
      const cmd = document.getElementById("cmd").value;
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ command: cmd })
      });
      const data = await res.json();
      document.getElementById("output").value = (data.response || []).join("\n");
    }

    async function teachSkill() {
      const trig = document.getElementById("teach_trigger").value;
      const cmd  = document.getElementById("teach_command").value;
      const res  = await fetch("/teach", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ trigger: trig, command: cmd })
      });
      const data = await res.json();
      document.getElementById("teach_output").value = JSON.stringify(data, null, 2);
    }

    async function loadSkills() {
      const res  = await fetch("/skills");
      const data = await res.json();
      const lines = [
        "📄 JSON/DB Skills:",
        ...data.json_db_skills.map(s => "  • " + s),
        "",
        "🐍 Python Skills:",
        ...data.python_skills.map(s => "  • " + s)
      ];
      document.getElementById("skills_list").value = lines.join("\n");
    }

    // Auto-load skills when page opens
    window.onload = loadSkills;
  </script>

  <!-- 2) Bootstrap JS Bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
</body>
</html>

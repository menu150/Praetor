<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Praetor Dashboard Prototype</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="flex h-screen bg-gray-100">
  <div class="flex flex-1">
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r p-4">
      <h2 class="text-xl font-bold mb-6">Praetor Dashboard</h2>
      <nav>
        <ul>
          <li class="mb-2 hover:text-blue-600 cursor-pointer">Overview</li>
          <li class="mb-2 hover:text-blue-600 cursor-pointer">Console</li>
          <li class="mb-2 hover:text-blue-600 cursor-pointer">Skills</li>
          <li class="mb-2 hover:text-blue-600 cursor-pointer">Integrations</li>
          <li class="mb-2 hover:text-blue-600 cursor-pointer">Settings</li>
        </ul>
      </nav>
    </aside>

    <!-- Main content -->
    <main class="flex-1 p-6 overflow-y-auto">
      <!-- Header -->
      <div class="flex justify-between items-center mb-4">
        <h1 class="text-2xl font-semibold">Overview</h1>
        <button class="px-4 py-2 bg-white border rounded">Toggle Dark Mode</button>
      </div>

      <!-- Metrics cards -->
      <div class="grid grid-cols-3 gap-4 mb-6">
        <div class="bg-white p-4 rounded shadow">
          <h2 class="text-gray-500 text-sm">Requests per minute</h2>
          <p id="rpmValue" class="text-2xl font-bold">--</p>
        </div>
        <div class="bg-white p-4 rounded shadow">
          <h2 class="text-gray-500 text-sm">Agent uptime</h2>
          <p id="uptimeValue" class="text-2xl font-bold">--</p>
        </div>
        <div class="bg-white p-4 rounded shadow">
          <h2 class="text-gray-500 text-sm">Error rate</h2>
          <p id="errorRateValue" class="text-2xl font-bold">--</p>
        </div>
      </div>

      <!-- Chart -->
      <div class="bg-white p-4 rounded shadow mb-6">
        <canvas id="rpmChart"></canvas>
      </div>

      <!-- Latest News -->
      <div class="bg-white p-4 rounded shadow mb-6">
        <h2 class="text-xl font-semibold mb-2">Latest News</h2>
        <div id="newsContainer" class="space-y-4">
          <p class="text-gray-500">Loading news...</p>
        </div>
      </div>

      <!-- Chat widget -->
      <div class="bg-white p-4 rounded shadow">
        <h2 class="text-xl font-semibold mb-2">Chat with Praetor</h2>
        <div id="chatWindow" class="h-48 overflow-y-auto border p-2 mb-2"></div>
        <div class="flex">
          <input id="chatInput" class="flex-1 border rounded p-2 mr-2" placeholder="Type a message…" autofocus />
          <button id="chatSend" class="px-4 py-2 bg-blue-600 text-white rounded">Send</button>
        </div>
      </div>
    </main>
  </div>

  <!-- All your JS lives inside this one script tag -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1) Chart & metrics
      const rpmData = [80,95,110,130,150,140,160,170,180,155];
      const labels  = ['9:50','9:55','10:00','10:05','10:10','10:15','10:20','10:25','10:30','Now'];
      const ctx = document.getElementById('rpmChart').getContext('2d');
      new Chart(ctx, {
        type: 'line',
        data: { labels, datasets:[{ label:'Req/min', data:rpmData, fill:false, tension:0.4 }] },
        options:{ responsive:true, scales:{ y:{ beginAtZero:true } } }
      });
      document.getElementById('rpmValue').textContent      = rpmData.pop();
      document.getElementById('uptimeValue').textContent   = '99.8%';
      document.getElementById('errorRateValue').textContent = '1.2%';

      // 2)
# Load the news
async function loadNews() {
  try {
    const res = await fetch('/api/news');
    const { articles = [] } = await res.json();
    // …render articles into #newsContainer…
  } catch (err) {
    console.error(err);
    // show error…
  }
}
loadNews();

      // 3) Chat widget
      function appendChat(src, msg) {
        const w = document.getElementById('chatWindow'),
              el = document.createElement('div');
        el.innerHTML = `<strong>${src}:</strong> ${msg}`;
        w.appendChild(el);
        w.scrollTop = w.scrollHeight;
      }
      document.getElementById('chatSend').addEventListener('click', async () => {
        const inp = document.getElementById('chatInput'),
              text = inp.value.trim();
        if (!text) return;
        appendChat('You', text);
        inp.value = '';
        try {
          const r = await fetch('/api/chat', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({ message:text })
          });
          const { reply } = await r.json();
          appendChat('Praetor', reply);
        } catch {
          appendChat('Praetor','Error: chat service unreachable.');
        }
      });
    });
  </script>
</body>
</html>
